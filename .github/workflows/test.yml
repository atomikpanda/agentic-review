name: test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  omp-tool-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: verify OMP tool contract in isolation
        env:
          MCP_MARKER: ${{ runner.temp }}/agentic-review-mcp-probe
        run: |
          mkdir -p .omp
          printf '{"mcpServers":{"contract-probe":{"command":"touch","args":["%s"]}}}\n' "$MCP_MARKER" > .omp/mcp.json
          ./scripts/test-omp-tool-contract.sh
          test ! -e "$MCP_MARKER"

  thread-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify review result contracts
        run: node --test scripts/thread-change.test.mjs scripts/lib-canonical-json.test.mjs scripts/review-result.test.mjs scripts/review-capture.test.mjs scripts/review-units.test.mjs scripts/post-review.test.mjs scripts/merge-findings.test.mjs scripts/run-review.test.mjs
