name: agentic-review

# Agentic PR review using oh-my-pi (omp) in headless read-only mode.
#
# This is the tier PR-Agent structurally cannot cover: PR-Agent makes
# single-shot model calls with no tool-use loop, so it can only ever see the
# diff. Roughly a fifth of the real findings on this repo's first PR required
# reading files *outside* the diff — noticing a variable file was gitignored
# and therefore absent in CI, or connecting a documented token scope to a call
# three directories away. That needs an agent with tools.
#
# Reusable: call it from any repo with
#   jobs:
#     review:
#       uses: <owner>/agentic-review/.github/workflows/agentic-review.yml@v1
#       secrets: { OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }} }
#       with:
#         central_ref: v1
#         model: openrouter/anthropic/claude-sonnet-5
#         thinking: high
#
# Point `uses:` at a release tag rather than @main, and set central_ref to
# match. This workflow runs with a token that can write to the caller's pull
# request, so @main means every commit here executes in every consuming repo
# the moment a PR opens. See README.md, "Which ref to point at".
#
# Every knob below has a default, so `with:` is optional. See README.md for the
# full table and the matching flags on scripts/run-review.sh.

on:
  workflow_call:
    outputs:
      analysis_state:
        description: Whether every configured pass completed against the immutable snapshot.
        value: ${{ jobs.review.outputs.analysis_state }}
      merge_state:
        description: Whether unresolved findings block the configured merge gate.
        value: ${{ jobs.review.outputs.merge_state }}
      sample_state:
        description: Whether the bounded sample is clean, has findings, or is unknown.
        value: ${{ jobs.review.outputs.sample_state }}
      bounded_converged:
        description: True exactly when analysis is complete and the sample is clean.
        value: ${{ jobs.review.outputs.bounded_converged }}
      reviewed_head:
        description: Immutable head SHA recorded in the final review result.
        value: ${{ jobs.review.outputs.reviewed_head }}
      scope_hash:
        description: SHA-256 identity of the immutable review scope.
        value: ${{ jobs.review.outputs.scope_hash }}
      coverage:
        description: Whether the configured immutable bounded execution completed.
        value: ${{ jobs.review.outputs.coverage }}
      remaining_analysis:
        description: JSON array of deterministic reason codes for incomplete analysis.
        value: ${{ jobs.review.outputs.remaining_analysis }}
      converged:
        description: Alias of bounded_converged.
        value: ${{ jobs.review.outputs.converged }}
      base_sha:
        description: Immutable base SHA reviewed by every pass.
        value: ${{ jobs.review.outputs.base_sha }}
      head_sha:
        description: Immutable head SHA reviewed by every pass.
        value: ${{ jobs.review.outputs.head_sha }}
      configuration_fingerprint:
        description: SHA-256 fingerprint of the trusted review configuration.
        value: ${{ jobs.review.outputs.configuration_fingerprint }}
      passes_requested:
        description: Number of ensemble passes requested.
        value: ${{ jobs.review.outputs.passes_requested }}
      passes_completed:
        description: Number of ensemble passes that returned valid structured output.
        value: ${{ jobs.review.outputs.passes_completed }}
      current_counts:
        description: JSON severity map for findings in the current ensemble.
        value: ${{ jobs.review.outputs.current_counts }}
      unresolved_counts:
        description: JSON severity map for held findings from prior reviews.
        value: ${{ jobs.review.outputs.unresolved_counts }}
      review_cycle_state:
        description: "Cross-run cycle state: active, ready, or review_cycle_exhausted."
        value: ${{ jobs.review.outputs.review_cycle_state }}
      review_phase:
        description: "Phase completed by this run: discovery or verification."
        value: ${{ jobs.review.outputs.review_phase }}
      review_next_phase:
        description: "Next persisted phase: discovery, verification, or none."
        value: ${{ jobs.review.outputs.review_next_phase }}
      discovery_round:
        description: Discovery round ordinal in the cross-run cycle.
        value: ${{ jobs.review.outputs.discovery_round }}
      max_discovery_rounds:
        description: Configured discovery-round budget for the cycle.
        value: ${{ jobs.review.outputs.max_discovery_rounds }}
    inputs:
      # --- model ------------------------------------------------------------
      target_repo:
        description: Optional owner/name override used by a same-repository manual dispatcher.
        type: string
        default: ''
      target_pr:
        description: Optional pull request number used by a same-repository manual dispatcher.
        type: string
        default: ''
      partition_shadow:
        description: Compute diagnostic-only partition manifests after review.
        type: boolean
        default: false
      model:
        description: Model slug, provider-prefixed (as it appears on openrouter.ai/models).
        type: string
        default: openrouter/openai/gpt-5.6-luna
      thinking:
        description: >-
          Reasoning effort — off|minimal|low|medium|high|xhigh|max|auto.
          Defaults to high. Historical testing with the default model improved
          tool use from 2 to 25 calls and measured recall from 5/11 to 8/11.
          Lower it to trade accuracy for time and cost.
        type: string
        default: high
      # --- what the agent may do -------------------------------------------
      tools:
        description: >-
          Comma-separated omp tool allowlist. Validated against a read-only set;
          anything outside it fails the job. See READ_ONLY_TOOLS below.
        type: string
        default: read,grep,glob
      max_time:
        description: Hard wall-clock cap passed to each model pass (e.g. 600, 10m, 1h). Empty means no cap.
        type: string
        default: ''
      max_parallel:
        description: Maximum independent model passes to execute concurrently.
        type: number
        default: 3
      # --- prompt and injected knowledge ------------------------------------
      prompt_path:
        description: >-
          Review instructions from the separately checked-out trusted central
          ref, never from the repository under review.
        type: string
        default: review/prompt.md
      skills_path:
        description: >-
          Comma-separated central-ref files appended to the system prompt. Each
          is resolved only from the trusted support checkout and concatenated.
        type: string
        default: skills/infra-review/SKILL.md,skills/security-review/SKILL.md
      max_findings:
        description: Upper bound on findings requested in the prompt. 0 disables the cap.
        type: number
        default: 20
      max_discovery_rounds:
        description: >-
          Maximum broad discovery rounds in one cross-run review cycle.
          Verification retries do not consume this budget.
        type: number
        default: 2
      review_cycle_override_reason:
        description: >-
          Authenticated human reason for opening exactly one additional discovery
          round after cycle exhaustion. Empty means no override.
        type: string
        default: ''
      codegraph:
        description: >-
          Build a symbol/dependency index of the changed files with codegraph
          (tree-sitter, never runs the project's build) and put it in the prompt.
          Adds roughly a second of indexing on a small repo.
        type: boolean
        default: true
      codegraph_version:
        description: codegraph release to pin, e.g. v1.5.0. Empty tracks the latest release.
        type: string
        default: ''
      max_diff_bytes:
        description: >-
          Cap on how much of the diff is put in the prompt. The diff dominates
          token cost on a large pull request; beyond this it is truncated and
          the agent is told so. 0 sends the whole thing.
        type: number
        default: 400000
      # --- outputs ----------------------------------------------------------
      review_mode:
        description: >-
          suggest — inline review comments with committable ```suggestion blocks
          where the agent can produce a complete fix (default).
          inline — the same inline comments, explanations only, no fixes.
          summary — one pull-request review body with everything in it, no line anchoring.
        type: string
        default: suggest
      resolve_stale:
        description: >-
          On each run, retire an earlier thread omitted by this reviewer only
          after a confirmed change to its original span. Hold unchanged or
          indeterminate spans, and stay silent about findings whose thread is
          still open instead of posting them again.
        type: boolean
        default: true
      suppress_writes:
        description: >-
          Produce the review but make no change to the pull request at all — no
          comment, no resolved thread, no edited comment. The artifact is still
          uploaded and fail_on_findings still applies. Use it to trial a config
          on a live pull request without touching it.
        type: boolean
        default: false
      post_comment:
        description: Post the review as a PR comment. Off still uploads the artifact.
        type: boolean
        default: true
      fail_on_findings:
        description: >-
          Fail the job when the merge gate says blocked — that is, when a finding
          lands on one of block_severities. Not on any finding: failing a build
          over a Medium was never the intent, and an inconclusive review is
          reported rather than failed, because that fault is ours.
        type: boolean
        default: false
      block_severities:
        description: Severities that block the merge gate. Empty blocks on nothing.
        type: string
        default: Critical,High
      # --- runner and pinning ----------------------------------------------
      #
      # There is deliberately no `runs_on` input. `runs-on` is resolved before
      # any step executes, so a value cannot be validated by this workflow —
      # validation code would already be running on the runner it was meant to
      # vet. A caller-supplied `self-hosted` would therefore check out
      # attacker-authored PR content onto a persistent machine holding the
      # model key. Changing the runner is a fork, not an input.
      # There is deliberately no `central_repo` input. This base-controlled
      # workflow names the central repository literally because a caller-supplied
      # value would be an execution hole: support fetched from an attacker-chosen
      # repository receives the model key and a token that can write to the pull
      # request.
      central_ref:
        description: >-
          Trusted central support ref. Accepts literal main, central release tags
          such as v1 and v1.2.3, or an exact lowercase 40-hex commit SHA. Pull
          refs, other branches, URLs, abbreviated SHAs, and expressions are rejected.
        type: string
        default: main
      timeout_minutes:
        description: Job timeout.
        type: number
        default: 20
      bun_version:
        description: Bun version. omp requires >= 1.3.14 and is bun-only — it does not run under node.
        type: string
        default: latest
      omp_version:
        description: npm dist-tag or exact version of @oh-my-pi/pi-coding-agent. Pin for reproducible reviews.
        type: string
        default: latest
      extra_omp_args:
        description: >-
          Space-separated harmless display flags not covered above. Currently
          allowed: --print-thoughts, --hide-thinking, and --no-title. Prompt,
          session, code-loading, model, tool, and scope flags are rejected.
        type: string
        default: ''
    secrets:
      OPENROUTER_API_KEY:
        required: true
      # Only App mode uses these, and only this repository holds them — a
      # consuming repo calling the reusable workflow never passes them and
      # never needs to. They are declared because a reusable workflow cannot
      # read a secret it has not declared, so without these two entries the
      # dispatch path would find them empty at runtime rather than fail here.
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

  # App mode. A GitHub App receives the webhook, and a receiver that does
  # nothing but verify the HMAC signature dispatches this workflow with the
  # target coordinates. The review then runs HERE, on an ephemeral runner,
  # rather than on whatever host received the webhook.
  #
  # That placement is the whole point. The alternative — reviewing on the host
  # that owns the App private key — means untrusted pull request code executes
  # next to a key that mints write tokens for every repository the App is
  # installed on. On a runner, the worst case is an ephemeral VM and a rotatable
  # model key.
  workflow_dispatch:
    inputs:
      target_repo:
        description: owner/name of the repository to review.
        type: string
        required: true
      target_pr:
        description: Pull request number to review.
        type: string
        required: true
      partition_shadow:
        description: Compute diagnostic-only partition manifests after review.
        type: boolean
        default: false
      max_parallel:
        description: Maximum independent model passes to execute concurrently.
        type: number
        default: 3
      max_discovery_rounds:
        description: Maximum broad discovery rounds in one cross-run review cycle.
        type: number
        default: 2
      review_cycle_override_reason:
        description: Reason for opening one additional discovery round after exhaustion.
        type: string
        required: false
        default: ''

  # `pull_request_target` loads this entry-point from the trusted base branch.
  # The reviewed head is checked out only as data; executable support is fetched
  # separately below from the selected central ref.
  #
  # Types are listed explicitly because the default pull-request action set is
  # [opened, synchronize, reopened] — and `synchronize` fires on every push to
  # an open PR. Left implicit, this agent would review on every push while
  # pr-agent (handle_push_trigger = false) reviews only on open, which is the
  # opposite of what the cost profile wants.
  #
  # `synchronize` is included deliberately: re-reviewing after a fix is how the
  # four review rounds on PR #1 each found something new. The concurrency block
  # below cancels superseded runs, so a burst of pushes costs one review, not
  # one per commit.
  #
  # To mirror pr-agent exactly (review on open only), delete `synchronize`.
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # In dispatch mode the ref is always the default branch, so grouping on it
  # would make two reviews of two different repositories cancel each other.
  # Group on the target instead.
  group: >-
    agentic-review-${{ inputs.target_repo || github.repository }}-${{
      inputs.target_pr || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts — matches pr-agent's handle_pr_actions, which fires on
    # ready_for_review rather than while a PR is still being iterated on.
    # A draft PR pushed ten times would otherwise cost ten reviews.
    #
    # Fork pull requests are skipped rather than failed. The target event would
    # make secrets available, but this project deliberately confines them to
    # same-repository reviews rather than processing outside contributions with
    # a write-capable token. Legacy callers still using `pull_request` are also
    # skipped: their entry-point YAML is not base-controlled.
    if: >-
      github.event_name != 'pull_request'
      && (github.event_name != 'pull_request_target' || github.event.pull_request.draft == false)
      && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes || 20 }}
    outputs:
      analysis_state: ${{ steps.continuation_poster.outputs.analysis_state || steps.poster.outputs.analysis_state || steps.cycle.outputs.analysis_state }}
      merge_state: ${{ steps.continuation_poster.outputs.merge_state || steps.poster.outputs.merge_state || steps.cycle.outputs.merge_state }}
      sample_state: ${{ steps.continuation_poster.outputs.sample_state || steps.poster.outputs.sample_state || steps.cycle.outputs.sample_state }}
      bounded_converged: ${{ steps.continuation_poster.outputs.bounded_converged || steps.poster.outputs.bounded_converged || steps.cycle.outputs.bounded_converged }}
      reviewed_head: ${{ steps.continuation_poster.outputs.reviewed_head || steps.poster.outputs.reviewed_head || steps.cycle.outputs.reviewed_head }}
      scope_hash: ${{ steps.continuation_poster.outputs.scope_hash || steps.poster.outputs.scope_hash || steps.cycle.outputs.scope_hash }}
      coverage: ${{ steps.continuation_poster.outputs.coverage || steps.poster.outputs.coverage || steps.cycle.outputs.coverage }}
      remaining_analysis: ${{ steps.continuation_poster.outputs.remaining_analysis || steps.poster.outputs.remaining_analysis || steps.cycle.outputs.remaining_analysis }}
      converged: ${{ steps.continuation_poster.outputs.converged || steps.poster.outputs.converged || steps.cycle.outputs.converged }}
      base_sha: ${{ steps.continuation_poster.outputs.base_sha || steps.poster.outputs.base_sha || steps.cycle.outputs.base_sha }}
      head_sha: ${{ steps.continuation_poster.outputs.head_sha || steps.poster.outputs.head_sha || steps.cycle.outputs.head_sha }}
      configuration_fingerprint: ${{ steps.continuation_poster.outputs.configuration_fingerprint || steps.poster.outputs.configuration_fingerprint || steps.cycle.outputs.configuration_fingerprint }}
      passes_requested: ${{ steps.continuation_poster.outputs.passes_requested || steps.poster.outputs.passes_requested || steps.cycle.outputs.passes_requested }}
      passes_completed: ${{ steps.continuation_poster.outputs.passes_completed || steps.poster.outputs.passes_completed || steps.cycle.outputs.passes_completed }}
      current_counts: ${{ steps.continuation_poster.outputs.current_counts || steps.poster.outputs.current_counts || steps.cycle.outputs.current_counts }}
      unresolved_counts: ${{ steps.continuation_poster.outputs.unresolved_counts || steps.poster.outputs.unresolved_counts || steps.cycle.outputs.unresolved_counts }}
      review_cycle_state: ${{ steps.continuation_poster.outputs.review_cycle_state || steps.poster.outputs.review_cycle_state || steps.cycle.outputs.cycle_state }}
      review_phase: ${{ steps.continuation_poster.outputs.review_phase || steps.poster.outputs.review_phase || steps.cycle.outputs.phase }}
      review_next_phase: ${{ steps.continuation_poster.outputs.review_next_phase || steps.poster.outputs.review_next_phase || steps.cycle.outputs.next_phase }}
      discovery_round: ${{ steps.continuation_poster.outputs.discovery_round || steps.poster.outputs.discovery_round || steps.cycle.outputs.discovery_round }}
      max_discovery_rounds: ${{ steps.continuation_poster.outputs.max_discovery_rounds || steps.poster.outputs.max_discovery_rounds || inputs.max_discovery_rounds || 2 }}
      shadow_repo: ${{ steps.target.outputs.repo }}
      shadow_pr: ${{ steps.target.outputs.pr }}
      shadow_base: ${{ steps.target.outputs.base }}
      shadow_head: ${{ steps.target.outputs.head }}
      shadow_eligible: ${{ steps.target.outputs.eligible }}
    steps:
      # ONE place that answers "what am I reviewing, and with what credential".
      # Everything downstream reads these outputs instead of
      # github.event.pull_request.*, which does not exist in dispatch mode.
      # Six scattered reads of the event context would have meant six places to
      # get the second mode wrong.
      - name: resolve the review target
        id: target
        env:
          # The workflow token, not the resolved one: this step PRODUCES the
          # resolved token, so referencing its own output here would always be
          # empty. In App mode the minted token is used from a local variable
          # further down instead.
          GH_TOKEN: ${{ github.token }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          IN_REPO: ${{ inputs.target_repo }}
          IN_PR: ${{ inputs.target_pr }}
        run: |
          set -euo pipefail

          if [ -z "${IN_REPO:-}" ]; then
            # pull_request_target mode: the trusted base workflow receives the
            # event coordinates, then checks out the reviewed head strictly as
            # data. Executable support comes from the separate central checkout.
            {
              echo "repo=${GITHUB_REPOSITORY}"
              echo "pr=${{ github.event.pull_request.number }}"
              echo "base=${{ github.event.pull_request.base.sha }}"
              echo "head=${{ github.event.pull_request.head.sha }}"
              echo "ref=${{ github.event.pull_request.head.sha }}"
              echo "eligible=true"
            } >> "$GITHUB_OUTPUT"
            # Deliberately NO token output here. github.token is a registered
            # secret and GitHub scrubs it out of step outputs, so routing it
            # through one yields an empty string — which surfaced as
            # "Input required and not supplied: token" at checkout, not as
            # anything mentioning secrets. Consumers fall back to github.token
            # directly when this output is absent.
            echo "  pull_request_target mode: ${GITHUB_REPOSITORY}#${{ github.event.pull_request.number }}"
            exit 0
          fi

          case "$IN_REPO" in
            */*[!A-Za-z0-9._/-]*|*/*/*|/*|*/) echo "::error::target_repo is not a plain owner/name: $IN_REPO"; exit 1 ;;
            */*) ;;
            *) echo "::error::target_repo is not owner/name: $IN_REPO"; exit 1 ;;
          esac
          case "$IN_PR" in ''|*[!0-9]*) echo "::error::target_pr is not a number: $IN_PR"; exit 1 ;; esac

          if [ "$IN_REPO" = "$GITHUB_REPOSITORY" ]; then
            gh_t() { gh api "repos/${IN_REPO}/pulls/${IN_PR}" --jq "$1"; }
            [ "$(gh_t .state)" = "open" ] || { echo "::error::${IN_REPO}#${IN_PR} is not open"; exit 1; }
            if [ "$(gh_t .draft)" = "true" ]; then
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "  same-repository dispatch: ${IN_REPO}#${IN_PR} is a draft — skipped"
              exit 0
            fi
            if [ "$(gh_t '.head.repo.full_name == .base.repo.full_name')" != "true" ]; then
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "  same-repository dispatch: ${IN_REPO}#${IN_PR} is from a fork — skipped"
              exit 0
            fi
            {
              echo "repo=$IN_REPO"
              echo "eligible=true"
              echo "pr=$IN_PR"
              echo "base=$(gh_t .base.sha)"
              echo "head=$(gh_t .head.sha)"
              echo "ref=$(gh_t .head.sha)"
            } >> "$GITHUB_OUTPUT"
            echo "  same-repository dispatch: ${IN_REPO}#${IN_PR}"
            exit 0
          fi

          # App mode. The workflow token cannot read another repository, so the
          # credential has to come from the App installation.
          [ -n "${APP_ID:-}" ] && [ -n "${APP_PRIVATE_KEY:-}" ] \
            || { echo "::error::target_repo was given but APP_ID/APP_PRIVATE_KEY are not set — dispatch mode needs the App credentials to mint an installation token"; exit 1; }

          # Cross-repository App mode is validated above before minting credentials.

          # Minted inline rather than from a checked-out script: this step runs
          # BEFORE any checkout, because the checkout needs the credential this
          # produces. Node's crypto signs the RS256 assertion; there is no
          # dependency to install.
          cat > "${RUNNER_TEMP}/app-token.mjs" <<'NODE'
          import { createSign } from "node:crypto";
          const [repo] = process.argv.slice(2);
          const b64 = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
          const now = Math.floor(Date.now() / 1000);
          // iat backdated 60s: GitHub rejects an assertion whose iat is in the
          // future, and runner clocks drift.
          const claims = { iat: now - 60, exp: now + 540, iss: process.env.APP_ID };
          const body = `${b64({ alg: "RS256", typ: "JWT" })}.${b64(claims)}`;
          const sig = createSign("RSA-SHA256").update(body).end()
            .sign(process.env.APP_PRIVATE_KEY, "base64url");
          const jwt = `${body}.${sig}`;

          const api = async (url, opts = {}) => {
            const r = await fetch(url, {
              ...opts,
              headers: { authorization: `Bearer ${jwt}`, accept: "application/vnd.github+json", ...opts.headers },
            });
            if (!r.ok) throw new Error(`${opts.method ?? "GET"} ${url} -> ${r.status} ${await r.text()}`);
            return r.json();
          };

          // Ask which installation covers this repository rather than taking an
          // installation id as input: an id supplied by the caller would let a
          // compromised receiver point the review at an unrelated installation.
          const inst = await api(`https://api.github.com/repos/${repo}/installation`);
          const tok = await api(inst.access_tokens_url, {
            method: "POST",
            headers: { "content-type": "application/json" },
            // Scope the token to the one repository and the three permissions
            // the review actually uses. The App may be installed far more widely;
            // this token must not be.
            body: JSON.stringify({
              repositories: [repo.split("/")[1]],
              permissions: { contents: "read", pull_requests: "write" },
            }),
          });
          process.stdout.write(tok.token);
          NODE
          token="$(node "${RUNNER_TEMP}/app-token.mjs" "$IN_REPO")"
          # Mask before it can reach any log. add-mask is what keeps a minted
          # token out of error traces and `set -x` output.
          echo "::add-mask::$token"

          gh_t() { GH_TOKEN="$token" gh api "repos/${IN_REPO}/pulls/${IN_PR}" --jq "$1"; }
          [ "$(gh_t .state)" = "open" ] || { echo "::error::${IN_REPO}#${IN_PR} is not open"; exit 1; }
          if [ "$(gh_t .draft)" = "true" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "  app mode: ${IN_REPO}#${IN_PR} is a draft — skipped"
            exit 0
          fi
          # Same stance as pull_request_target mode: forks are skipped, not failed.
          # The head commit may not even exist in the base repo.
          if [ "$(gh_t '.head.repo.full_name == .base.repo.full_name')" != "true" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "  app mode: ${IN_REPO}#${IN_PR} is from a fork — skipped"
            exit 0
          fi

          {
            echo "repo=$IN_REPO"
            echo "eligible=true"
            echo "pr=$IN_PR"
            echo "base=$(gh_t .base.sha)"
            echo "head=$(gh_t .head.sha)"
            echo "token=$token"
          } >> "$GITHUB_OUTPUT"
          echo "  app mode: ${IN_REPO}#${IN_PR}"

      - uses: actions/checkout@v4
        if: steps.target.outputs.eligible == 'true'
        with:
          repository: ${{ steps.target.outputs.repo }}
          ref: ${{ steps.target.outputs.head }}
          token: ${{ steps.target.outputs.token || github.token }}
          # Need the base commit to diff against.
          fetch-depth: 0
          # actions/checkout otherwise writes a basic-auth header containing the
          # workflow token into .git/config, and it stays there for the rest of
          # the job. The agent has `read`, so a prompt injection in the diff can
          # ask for .git/config and the token lands in a public PR comment.
          # Everything after this point is local git — diff, show, cat-file — so
          # nothing needs the credential to persist.
          persist-credentials: false

      # The runner, data, stripper, and poster always come from a separate
      # central checkout. This is required even when reviewing this repository:
      # the target head is untrusted data and never supplies code that receives
      # the model key or write-capable token.
      - name: resolve trusted central ref
        id: central-ref
        if: steps.target.outputs.eligible == 'true'
        env:
          IN_CENTRAL_REF: ${{ inputs.central_ref }}
        run: |
          set -euo pipefail
          CENTRAL_REF="${IN_CENTRAL_REF:-main}"
          if [ "$CENTRAL_REF" = "main" ]; then
            RESOLVED_REF="refs/heads/main"
          elif [[ "$CENTRAL_REF" =~ ^[0-9a-f]{40}$ ]]; then
            RESOLVED_REF="$CENTRAL_REF"
          elif [[ "$CENTRAL_REF" =~ ^v(0|[1-9][0-9]*)$ ]] \
            || [[ "$CENTRAL_REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            RESOLVED_REF="refs/tags/$CENTRAL_REF"
          else
            echo "::error::central_ref must be main, a central release tag (vN or vN.N.N), or an exact lowercase 40-hex SHA: $CENTRAL_REF"
            exit 1
          fi
          echo "ref=$RESOLVED_REF" >> "$GITHUB_OUTPUT"

      - name: prepare trusted support checkout
        if: steps.target.outputs.eligible == 'true'
        run: |
          # The reviewed tree may contain this path or make it a symlink. Remove
          # it before checkout so a failed central fetch cannot leave a
          # target-controlled directory that looks like trusted support.
          rm -rf -- .central-skills

      - name: fetch shared prompt, skills and poster
        if: steps.target.outputs.eligible == 'true'
        id: central
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          # A LITERAL, on purpose, and not an input.
          #
          # As an input, a same-repository pull request could edit its own caller
          # to point this anywhere, and the poster fetched from here runs with a
          # token that can write to the pull request.
          #
          # Deriving it from github.workflow_ref was worse. In a reusable
          # workflow that context describes the CALLER's entry-point workflow,
          # not this file, so on an enrolled repository it resolved to the repo
          # being reviewed — fetching the poster from the very tree under review.
          # There is no context variable that names the reusable workflow's own
          # repository.
          #
          # A literal is correct because it lives in THIS file: a consuming
          # repository cannot change it, and a fork's copy names the fork.
          repository: atomikpanda/agentic-review
          ref: ${{ steps.central-ref.outputs.ref }}
          persist-credentials: false
          path: .central-skills
          sparse-checkout: |
            skills
            review
            scripts

      # Every input is resolved here, once, into the environment. Two reasons:
      #
      # 1. Inputs are NOT populated when this workflow runs from its own
      #    `pull_request` trigger rather than via `workflow_call` — and
      #    `default:` does not apply on that path either. Every value therefore
      #    needs a shell-side fallback, and having them in one block is the only
      #    way to keep the two paths honestly identical.
      # 2. `${{ inputs.x }}` expanded directly inside a `run:` body is template
      #    substitution into shell source. A value containing a backtick or
      #    $(...) would execute. Passing through `env:` makes them data.
      - name: resolve config
        if: steps.target.outputs.eligible == 'true'
        env:
          IN_MODEL: ${{ inputs.model }}
          IN_THINKING: ${{ inputs.thinking }}
          IN_TOOLS: ${{ inputs.tools }}
          IN_CENTRAL_REPO: atomikpanda/agentic-review
          IN_MAX_TIME: ${{ inputs.max_time }}
          IN_MAX_PARALLEL: ${{ inputs.max_parallel }}
          IN_PROMPT_PATH: ${{ inputs.prompt_path }}
          IN_SKILLS_PATH: ${{ inputs.skills_path }}
          IN_MAX_FINDINGS: ${{ inputs.max_findings }}
          IN_MAX_DISCOVERY_ROUNDS: ${{ inputs.max_discovery_rounds }}
          IN_REVIEW_CYCLE_OVERRIDE_REASON: ${{ inputs.review_cycle_override_reason }}
          IN_MAX_DIFF_BYTES: ${{ inputs.max_diff_bytes }}
          IN_CODEGRAPH: ${{ inputs.codegraph }}
          IN_CODEGRAPH_VERSION: ${{ inputs.codegraph_version }}
          IN_REVIEW_MODE: ${{ inputs.review_mode }}
          IN_POST_COMMENT: ${{ inputs.post_comment }}
          IN_SUPPRESS_WRITES: ${{ inputs.suppress_writes }}
          IN_RESOLVE_STALE: ${{ inputs.resolve_stale }}
          IN_FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
          IN_BLOCK_SEVERITIES: ${{ inputs.block_severities }}
          IN_BUN_VERSION: ${{ inputs.bun_version }}
          IN_OMP_VERSION: ${{ inputs.omp_version }}
          IN_EXTRA_ARGS: ${{ inputs.extra_omp_args }}
        run: |
          set -euo pipefail

          # Every input lands in GITHUB_ENV below, which is a line-oriented
          # file: a value containing a newline writes extra records. A caller
          # passing $'--add-dir docs\nPOST_COMMENT=false' would set an
          # unrelated variable AFTER the allowlist checks in this step had
          # already passed. None of these values has any reason to span lines.
          for v in IN_MODEL IN_THINKING IN_TOOLS IN_MAX_TIME IN_MAX_PARALLEL \
                   IN_PROMPT_PATH IN_SKILLS_PATH IN_MAX_FINDINGS \
                   IN_MAX_DISCOVERY_ROUNDS IN_REVIEW_CYCLE_OVERRIDE_REASON \
                   IN_REVIEW_MODE IN_POST_COMMENT IN_FAIL_ON_FINDINGS \
                   IN_BUN_VERSION IN_OMP_VERSION IN_EXTRA_ARGS IN_CENTRAL_REPO \
                   IN_MAX_DIFF_BYTES IN_CODEGRAPH_VERSION IN_BLOCK_SEVERITIES \
                   IN_SUPPRESS_WRITES IN_RESOLVE_STALE; do
            if [ "${!v}" != "${!v//[$'\n\r']/}" ]; then
              echo "::error::$v must not contain a newline"
              exit 1
            fi
          done

          # The full read-only subset of omp's builtin tools. Deliberately
          # excluded and NOT overridable from a caller:
          #   bash edit write ast_edit eval debug browser computer github task
          #   hub web_search memory_edit retain learn manage_skill checkpoint
          #   rewind ask security_scan lsp
          # A PR diff is attacker-controlled text and this agent reads it, so it
          # must not be able to execute anything, modify the checkout, reach the
          # network, or write back to GitHub. Prompt injection then has nothing
          # to reach for. Note `security_scan` and `web_search` look harmless by
          # name but both egress to the network; `ask` blocks forever under -p.
          #
          # `lsp` is excluded for a subtler reason and it cost this project its
          # cross-file symbol resolution. omp discovers language-server config
          # from the PROJECT directory — lsp.json, .lsp.json, lsp.yaml and
          # friends — and the project directory here is the checked-out pull
          # request. A PR can therefore commit an lsp.json naming an arbitrary
          # command; `lsp` is read-tier so the approval mode auto-approves it,
          # and omp spawns that command with the model key in its environment.
          # That is arbitrary execution through the one tool included for
          # reading code. The precomputed code graph and grep carry that load.
          READ_ONLY_TOOLS="read grep glob"

          TOOLS="${IN_TOOLS:-read,grep,glob}"
          bad=""
          for t in ${TOOLS//,/ }; do
            case " $READ_ONLY_TOOLS " in
              *" $t "*) ;;
              *) bad="$bad $t" ;;
            esac
          done
          if [ -n "$bad" ]; then
            echo "::error::tools not permitted:$bad"
            echo "This workflow only runs read-only tools. Permitted: $READ_ONLY_TOOLS"
            exit 1
          fi

          # Treat the escape hatch as a tiny allowlist rather than trying to
          # enumerate every flag that can terminate option parsing, inject
          # instructions, load code/config, resume state, or widen scope.
          EXTRA_ARGS="${IN_EXTRA_ARGS:-}"
          if [ -n "$EXTRA_ARGS" ]; then
            set -f
            # shellcheck disable=SC2206  # deliberate validated word splitting
            _extra=($EXTRA_ARGS)
            set +f
            for arg in "${_extra[@]}"; do
              case "$arg" in
                --print-thoughts|--hide-thinking|--no-title) ;;
                *)
                  echo "::error::extra_omp_args token is not permitted: $arg"
                  echo "Permitted: --print-thoughts --hide-thinking --no-title"
                  exit 1 ;;
              esac
            done
          fi

          OMP_VERSION="${IN_OMP_VERSION:-latest}"
          if [[ ! "$OMP_VERSION" =~ ^[A-Za-z][A-Za-z0-9._-]*$ ]] \
            && [[ ! "$OMP_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::omp_version must be a safe npm dist-tag or exact semver: $OMP_VERSION"
            exit 1
          fi

          REVIEW_MODE="${IN_REVIEW_MODE:-suggest}"
          case "$REVIEW_MODE" in
            suggest|inline|summary) ;;
            *) echo "::error::review_mode must be suggest, inline or summary (got '$REVIEW_MODE')"; exit 1 ;;
          esac
          MAX_DISCOVERY_ROUNDS="${IN_MAX_DISCOVERY_ROUNDS:-2}"
          case "$MAX_DISCOVERY_ROUNDS" in
            ''|*[!0-9]*|0) echo "::error::max_discovery_rounds must be a positive integer"; exit 1 ;;
          esac
          MAX_PARALLEL="${IN_MAX_PARALLEL:-3}"
          case "$MAX_PARALLEL" in
            ''|*[!0-9]*) echo "::error::max_parallel must be a positive integer"; exit 1 ;;
            *[1-9]*) ;;
            *) echo "::error::max_parallel must be a positive integer"; exit 1 ;;
          esac


          {
            echo "REVIEW_MODE=$REVIEW_MODE"
            echo "MODEL=${IN_MODEL:-openrouter/openai/gpt-5.6-luna}"
            echo "THINKING=${IN_THINKING:-high}"
            echo "TOOLS=$TOOLS"
            echo "CENTRAL_REPO=${IN_CENTRAL_REPO:-atomikpanda/agentic-review}"
            echo "MAX_TIME=${IN_MAX_TIME:-}"
            echo "MAX_PARALLEL=$MAX_PARALLEL"
            echo "PROMPT_PATH=${IN_PROMPT_PATH:-review/prompt.md}"
            echo "SKILLS_PATH=${IN_SKILLS_PATH:-skills/infra-review/SKILL.md,skills/security-review/SKILL.md}"
            echo "MAX_FINDINGS=${IN_MAX_FINDINGS:-20}"
            echo "MAX_DISCOVERY_ROUNDS=$MAX_DISCOVERY_ROUNDS"
            echo "REVIEW_CYCLE_OVERRIDE_REASON=${IN_REVIEW_CYCLE_OVERRIDE_REASON:-}"
            echo "MAX_DIFF_BYTES=${IN_MAX_DIFF_BYTES:-400000}"
            echo "CODEGRAPH=${IN_CODEGRAPH:-true}"
            echo "CODEGRAPH_VERSION=${IN_CODEGRAPH_VERSION:-}"
            echo "POST_COMMENT=${IN_POST_COMMENT:-true}"
            echo "SUPPRESS_WRITES=${IN_SUPPRESS_WRITES:-false}"
            echo "RESOLVE_STALE=${IN_RESOLVE_STALE:-true}"
            echo "FAIL_ON_FINDINGS=${IN_FAIL_ON_FINDINGS:-false}"
            echo "BLOCK_SEVERITIES=${IN_BLOCK_SEVERITIES:-Critical,High}"
            echo "BUN_VERSION=${IN_BUN_VERSION:-latest}"
            echo "OMP_VERSION=$OMP_VERSION"
            echo "EXTRA_ARGS=$EXTRA_ARGS"
          } >> "$GITHUB_ENV"

          echo "  model=${IN_MODEL:-openrouter/openai/gpt-5.6-luna} tools=$TOOLS thinking=${IN_THINKING:-<model default>}"

      - uses: oven-sh/setup-bun@v2
        if: steps.target.outputs.eligible == 'true'
        with:
          # omp ships `#!/usr/bin/env bun` and imports `bun:` builtins, so bun
          # is not an optional accelerator here — node cannot load it at all.
          # package.json declares engines.bun >= 1.3.14.
          bun-version: ${{ inputs.bun_version || 'latest' }}

      - name: select trusted support
        if: steps.target.outputs.eligible == 'true'
        env:
          CENTRAL_REPO: atomikpanda/agentic-review
          CENTRAL_OUTCOME: ${{ steps.central.outcome }}
        run: |
          set -euo pipefail
          [ "$CENTRAL_OUTCOME" = "success" ] || {
            echo "::error::trusted support checkout from $CENTRAL_REPO failed"
            exit 1
          }
          [ -d .central-skills ] || {
            echo "::error::trusted support checkout from $CENTRAL_REPO is unavailable"
            exit 1
          }
          SUPPORT_ROOT="$(cd -P .central-skills && pwd)"
          echo "  support: $CENTRAL_REPO"

          REVIEW_RUNNER="$SUPPORT_ROOT/scripts/run-review.sh"
          REVIEW_POSTER="$SUPPORT_ROOT/scripts/post-review.mjs"
          REVIEW_RESULT_HELPER="$SUPPORT_ROOT/scripts/review-result.mjs"
          REVIEW_STRIPPER="$SUPPORT_ROOT/scripts/strip-agent-config.sh"
          for file in "$REVIEW_RUNNER" "$REVIEW_POSTER" "$REVIEW_RESULT_HELPER" "$REVIEW_STRIPPER"; do
            [ -f "$file" ] || {
              echo "::error::trusted support file is missing: $file"
              exit 1
            }
          done
          case "$SUPPORT_ROOT" in /*) ;; *) echo "::error::trusted support root is not absolute"; exit 1 ;; esac
          {
            echo "TRUSTED_DATA_ROOT=$SUPPORT_ROOT"
            echo "REVIEW_RUNNER=$REVIEW_RUNNER"
            echo "REVIEW_POSTER=$REVIEW_POSTER"
            echo "REVIEW_RESULT_HELPER=$REVIEW_RESULT_HELPER"
            echo "REVIEW_STRIPPER=$REVIEW_STRIPPER"
          } >> "$GITHUB_ENV"

      # Install codegraph and record explicit opt-in in the source checkout.
      # The shared runner rebuilds and queries it only inside the immutable
      # review worktree, using the base commit's trusted configuration.
      - name: install code graph
        if: steps.target.outputs.eligible == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "${CODEGRAPH:-true}" != "true" ]; then echo "  disabled"; exit 0; fi

          export CODEGRAPH_INSTALL_DIR="$RUNNER_TEMP/cg"
          export CODEGRAPH_BIN_DIR="$RUNNER_TEMP/cg/bin"
          export CODEGRAPH_TELEMETRY=0
          if [ -n "${CODEGRAPH_VERSION:-}" ]; then export CODEGRAPH_VERSION; fi
          curl -fsSL https://raw.githubusercontent.com/colbymchenry/codegraph/main/install.sh | sh
          echo "$CODEGRAPH_BIN_DIR" >> "$GITHUB_PATH"

          # A target-controlled symlink must not redirect this marker outside
          # the checkout. The marker carries no index data; the runner creates
          # the exact snapshot index later.
          rm -rf -- .codegraph
          mkdir .codegraph
          echo "  codegraph installed; snapshot indexing delegated to the runner"

      - name: resolve trusted prompt and skills
        if: steps.target.outputs.eligible == 'true'
        run: |
          set -euo pipefail

          # Instructions are support data, so they follow the same trust
          # boundary as the runner and poster rather than the reviewed tree.
          safe_path() {
            case "$1" in
              /*|*..*) echo "::error::path must be relative and must not contain '..': $1"; exit 1 ;;
            esac
          }
          resolve() { # resolve <path> <destination>; 0 if found
            safe_path "$1"
            if [ -f "$TRUSTED_DATA_ROOT/$1" ]; then
              cp "$TRUSTED_DATA_ROOT/$1" "$2"
              echo "    $1 (from trusted support)" >&2
              return 0
            fi
            return 1
          }

          safe_path "$PROMPT_PATH"
          if ! resolve "$PROMPT_PATH" /tmp/prompt-body.md; then
            echo "::warning::no trusted review instructions found — falling back to the workflow's built-in prompt"
            {
              printf '%s\n' 'Review the changes on this branch.'
              printf '%s\n' ''
              printf '%s\n' 'You have read-only tools. Use them to follow changed values and contracts'
              printf '%s\n' 'across files. Report only verified defects with an observable failure.'
            } > /tmp/prompt-body.md
          fi

          : > /tmp/skill.md
          IFS=',' read -ra _skills <<< "$SKILLS_PATH"
          for sk in "${_skills[@]}"; do
            sk="$(printf '%s' "$sk" | tr -d '[:space:]')"
            [ -n "$sk" ] || continue
            if resolve "$sk" /tmp/one-skill.md; then
              cat /tmp/one-skill.md >> /tmp/skill.md
              printf '\n\n' >> /tmp/skill.md
            else
              echo "::warning::skill file not found: $sk"
            fi
          done

          {
            echo "PROMPT_FILE=/tmp/prompt-body.md"
            echo "SKILL_FILE=/tmp/skill.md"
          } >> "$GITHUB_ENV"
          echo "  prompt and skills resolved to absolute trusted files"

      # SECURITY-CRITICAL. omp loads MCP server definitions from agent config
      # directories in the WORKING DIRECTORY and spawns the commands they name.
      # That happens at startup, before any tool is invoked, and none of
      # --tools, --approval-mode, --no-extensions, --no-skills or --no-rules
      # affects it. A pull request that commits .omp/mcp.json therefore gets
      # arbitrary command execution on this runner, with OPENROUTER_API_KEY in
      # the environment — completely bypassing the read-only tool allowlist
      # that the rest of this workflow rests on.
      #
      # Verified against omp 17.2.4 with a config naming `/bin/sh -c "touch
      # PROOF"`, under the exact flags used below. Executed from .omp/,
      # .claude/ and .cursor/. Did NOT execute from .github/, .vscode/ or
      # .windsurf/ — so the honoured set is narrower than omp's flavour table
      # lists. Adding --no-extensions --no-skills --no-rules made no
      # difference; this is loaded independently of the tool system.
      #
      # The whole flavour directories are removed rather than just mcp.json,
      # because their other settings can also change approval behaviour, and
      # because which flavours are honoured is an omp implementation detail
      # that can widen in any release. .github and .vscode are ordinary project
      # directories — this reviewer exists partly to review .github/workflows —
      # so only the two files omp reads are taken from those.
      #
      # The diff still contains every one of these files, so the agent can
      # still see and report on them. It simply cannot be configured by them.
      - name: plan bounded review cycle
        id: cycle
        if: steps.target.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.target.outputs.token || github.token }}
          GITHUB_REPO: ${{ steps.target.outputs.repo }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          HEAD_SHA: ${{ steps.target.outputs.head }}
          BASE_SHA: ${{ steps.target.outputs.base }}
          REVIEW_CYCLE_PLAN_FILE: /tmp/review-cycle-plan.json
          KNOWN_FINDINGS_FILE: /tmp/review-known-findings.json
          REVIEW_RESULT_FILE: /tmp/review-result.json
          REVIEW_CYCLE_OVERRIDE_ACTOR: ${{ inputs.review_cycle_override_reason && github.event_name == 'workflow_dispatch' && github.actor || '' }}
          REVIEW_CYCLE_OVERRIDE_INVOCATION: ${{ inputs.review_cycle_override_reason && github.event_name == 'workflow_dispatch' && github.run_id || '' }}
        run: |
          set -euo pipefail
          node "$REVIEW_POSTER" cycle-plan

      - name: strip agent configuration from the checkout
        if: steps.target.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          # Assert rather than assume. If a future edit drops
          # persist-credentials, the token is readable again and nothing else
          # here would notice.
          for cfg in .git/config .central-skills/.git/config; do
            if [ -f "$cfg" ] && grep -qi 'extraheader' "$cfg"; then
              echo "::error::$cfg contains a persisted credential; the read-only agent can read it"
              exit 1
            fi
          done

          # The list lives in one file, read by this step and by
          # scripts/run-review.sh. It was written out twice before and drifted
          # twice: first .cline was in one copy and not the other, then the four
          # nested paths above were added here and never reached the local
          # runner — so a local review, on a developer's own machine, checked
          # strictly fewer places than this ephemeral runner did.
          #
          # External targets can supply neither this executable nor the runner
          # helpers: all come from the selected central support root. The only
          # branch copy allowed is the explicit same-repository self-review path.
          out="$(bash "$REVIEW_STRIPPER" --strip .)"
          if [ -n "$out" ]; then echo "  $out"; else echo "  no agent configuration present"; fi

      - name: run agentic review (read-only)
        if: steps.target.outputs.eligible == 'true' && steps.cycle.outputs.should_run == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BASE: ${{ steps.target.outputs.base }}
          HEAD: ${{ steps.target.outputs.head }}
          AGENTIC_REVIEW_PHASE: ${{ steps.cycle.outputs.phase }}
          AGENTIC_REVIEW_KNOWN_FINDINGS: /tmp/review-known-findings.json
          PARTITION_SHADOW: ${{ inputs.partition_shadow }}
        run: &run-review-phase |
          set -euo pipefail
          actual_head="$(git rev-parse --verify 'HEAD^{commit}')"
          [ "$actual_head" = "$HEAD" ] || {
            echo "::error::checked-out head $actual_head does not match resolved target $HEAD"
            exit 1
          }

          REVIEW_FINDINGS_FILE=/tmp/review.md
          REVIEW_PUBLICATION_FILE=/tmp/review-publication.json
          REVIEW_DIAGNOSTICS_FILE=/tmp/review-pass-diagnostics.json
          REVIEW_RUNNER_STDOUT=/tmp/review-runner.out
          REVIEW_RUNNER_STDERR=/tmp/review-runner.err
          # A failed continuation must not let its poster consume the preceding
          # verification publication as if it came from final discovery.
          REVIEW_PARTITION_SHADOW_PROFILE=/tmp/review-partition-shadow-profile.json
          rm -f "$REVIEW_FINDINGS_FILE" "$REVIEW_PUBLICATION_FILE" \
            "$REVIEW_DIAGNOSTICS_FILE" "$REVIEW_RUNNER_STDOUT" "$REVIEW_RUNNER_STDERR"
          RUNNER_ARGS=(
            --base "$BASE"
            --model "$MODEL"
            --thinking "$THINKING"
            --tools "$TOOLS"
            --prompt "$PROMPT_FILE"
            --skill "$SKILL_FILE"
            --max-findings "$MAX_FINDINGS"
            --max-parallel "$MAX_PARALLEL"
            --review-mode "$REVIEW_MODE"
            --omp-version "$OMP_VERSION"
            --out "$REVIEW_FINDINGS_FILE"
            --publication-out "$REVIEW_PUBLICATION_FILE"
            --diagnostics-out "$REVIEW_DIAGNOSTICS_FILE"
            --no-state
            --no-fail
            --json
          )
          if [ -n "$MAX_TIME" ]; then RUNNER_ARGS+=(--max-time "$MAX_TIME"); fi
          if [ "${CODEGRAPH:-true}" != "true" ]; then RUNNER_ARGS+=(--no-codegraph); fi
          if [ "${PARTITION_SHADOW:-false}" = "true" ]; then
            rm -f "$REVIEW_PARTITION_SHADOW_PROFILE"
            RUNNER_ARGS+=(--execution-profile-out "$REVIEW_PARTITION_SHADOW_PROFILE")
          fi

          if [ -n "$EXTRA_ARGS" ]; then
            set -f
            # shellcheck disable=SC2206  # deliberate validated word splitting
            EXTRA=($EXTRA_ARGS)
            set +f
            RUNNER_ARGS+=(-- "${EXTRA[@]}")
          fi

          # --json prevents the local renderer from invoking the poster. Hosted
          # presentation and gating happen in the phase-specific poster step.
          if ! AGENTIC_REVIEW_MAX_DIFF_BYTES="$MAX_DIFF_BYTES" \
               AGENTIC_REVIEW_TRUSTED_DATA_ROOT="$TRUSTED_DATA_ROOT" \
               bash "$REVIEW_RUNNER" "${RUNNER_ARGS[@]}" \
                 > "$REVIEW_RUNNER_STDOUT" 2> "$REVIEW_RUNNER_STDERR"; then
            cat "$REVIEW_RUNNER_STDERR" >&2
            exit 1
          fi
          cat "$REVIEW_RUNNER_STDERR" >&2
          echo "  review result: $(wc -c < "$REVIEW_FINDINGS_FILE") bytes"
          echo "  publication: $(wc -c < "$REVIEW_PUBLICATION_FILE") bytes"

      - name: post review
        id: poster
        # Run after runner failure so the poster or this boundary can emit a
        # conservative result without posting missing or invalid artifacts.
        if: ${{ !cancelled() }}
        continue-on-error: ${{ steps.cycle.outputs.phase == 'verification' }}
        env:
          # The write-capable credential is confined to this presentation step.
          GH_TOKEN: ${{ steps.target.outputs.eligible == 'true' && (steps.target.outputs.token || github.token) || '' }}
          TARGET_ELIGIBLE: ${{ steps.target.outputs.eligible }}
          REVIEW_PUBLICATION_FILE: /tmp/review-publication.json
          REVIEW_RESULT_FILE: /tmp/review-result.json
          GITHUB_REPO: ${{ steps.target.outputs.repo }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          HEAD_SHA: ${{ steps.target.outputs.head }}
          BASE_SHA: ${{ steps.target.outputs.base }}
          REVIEW_CYCLE_PLAN_FILE: /tmp/review-cycle-plan.json
          CYCLE_SHOULD_RUN: ${{ steps.cycle.outputs.should_run }}
          CYCLE_STATE: ${{ steps.cycle.outputs.cycle_state }}
          CYCLE_PHASE: ${{ steps.cycle.outputs.phase }}
          CYCLE_NEXT_PHASE: ${{ steps.cycle.outputs.next_phase }}
          CYCLE_JSON: ${{ steps.cycle.outputs.cycle_json }}
          CYCLE_DISCOVERY_ROUND: ${{ steps.cycle.outputs.discovery_round }}
        run: &post-review-phase |
          if [ "${TARGET_ELIGIBLE:-}" = "false" ]; then
            exit 0
          fi
          if [ "${CYCLE_SHOULD_RUN:-}" = "false" ]; then
            {
              echo "review_cycle_state=${CYCLE_STATE}"
              echo "review_phase=${CYCLE_PHASE}"
              echo "review_next_phase=${CYCLE_NEXT_PHASE}"
              echo "discovery_round=${CYCLE_DISCOVERY_ROUND}"
              echo "max_discovery_rounds=${MAX_DISCOVERY_ROUNDS}"
            } >> "$GITHUB_OUTPUT"
            if [ "$CYCLE_STATE" = "review_cycle_exhausted" ]; then
              echo "::error::review cycle exhausted; an authenticated override is required"
              exit 1
            fi
            exit 0
          fi
          set -euo pipefail

          finalize_missing_surfaces() {
            node <<'NODE'
          const {
            appendFileSync,
            existsSync,
            readFileSync,
            writeFileSync,
          } = require("node:fs");

          const baseSha = process.env.BASE_SHA ?? "";
          const headSha = process.env.HEAD_SHA ?? "";
          const resultFile = process.env.REVIEW_RESULT_FILE || "/tmp/review-result.json";
          const isPlainObject = (value) => (
            value !== null
            && typeof value === "object"
            && !Array.isArray(value)
          );
          let persistedCycle = null;
          try {
            const candidate = JSON.parse(process.env.CYCLE_JSON ?? "null");
            if (isPlainObject(candidate)) persistedCycle = candidate;
          } catch {
            // Missing cycle evidence keeps the fallback cycle-free.
          }
          let trustedMetadata = null;
          let trustedFailureResult = null;
          try {
            trustedMetadata = JSON.parse(process.env.TRUSTED_METADATA ?? "");
            trustedFailureResult = JSON.parse(process.env.TRUSTED_FAILURE_RESULT ?? "");
          } catch {
            // Missing or invalid trusted evidence keeps the zero-valued fallback.
          }
          const trustedBaseSha = trustedFailureResult?.base_sha ?? "";
          const trustedHeadSha = trustedFailureResult?.head_sha ?? "";
          const trustedScopeHash = trustedFailureResult?.scope_hash ?? "";
          const trustedConfigurationFingerprint = (
            trustedFailureResult?.configuration_fingerprint ?? ""
          );
          const trustedPassesRequested = trustedFailureResult?.passes_requested ?? 0;
          const trustedPassesCompleted = trustedFailureResult?.passes_completed ?? 0;
          const trustedAnalysisState = trustedMetadata?.analysis_state ?? "";
          const trustedCoverage = trustedMetadata?.coverage ?? "";
          const trustedRemainingAnalysis = Array.isArray(trustedMetadata?.remaining_analysis)
            ? trustedMetadata.remaining_analysis
            : null;
          const conservativeResult = {
            ...(trustedFailureResult ?? {
              analysis_state: "inconclusive",
              merge_state: "ready",
              sample_state: "unknown",
              bounded_converged: false,
              base_sha: baseSha,
              head_sha: headSha,
              configuration_fingerprint: "",
              passes_requested: 0,
              passes_completed: 0,
              current_counts: { Critical: 0, High: 0, Medium: 0 },
              unresolved_counts: { Critical: 0, High: 0, Medium: 0 },
              reviewed_head: headSha,
              scope_hash: "",
              coverage: "unknown",
              remaining_analysis: ["execution_failed"],
              converged: false,
            }),
            ...(persistedCycle === null ? {} : { review_cycle: persistedCycle }),
          };
          const requiredFields = Object.keys(conservativeResult);
          const stateValues = {
            analysis_state: new Set(["complete", "inconclusive"]),
            merge_state: new Set(["blocked", "ready"]),
            sample_state: new Set(["clean", "findings", "unknown"]),
            coverage: new Set(["bounded", "unknown"]),
          };
          const stringFields = [
            "base_sha",
            "head_sha",
            "configuration_fingerprint",
            "reviewed_head",
            "scope_hash",
          ];
          const booleanFields = ["bounded_converged", "converged"];
          const integerFields = ["passes_requested", "passes_completed"];
          const severities = ["Critical", "High", "Medium"];
          const blockingSeverities = new Set(
            (process.env.BLOCK_SEVERITIES ?? "Critical,High")
              .split(",")
              .map((severity) => severity.trim())
              .filter(Boolean),
          );
          const fingerprintPattern = /^[0-9a-f]{64}$/;
          const remainingAnalysisReasons = [
            "diff_truncated",
            "finding_cap_reached",
            "pass_failed",
            "snapshot_mutable",
            "pass_scope_mismatch",
            "vote_threshold_applied",
            "merge_failed",
            "reconciliation_unknown",
            "execution_failed",
          ];
          const remainingAnalysisReasonSet = new Set(remainingAnalysisReasons);
          const posterOwnedRemainingAnalysisReasons = new Set([
            "reconciliation_unknown",
            "execution_failed",
          ]);

          function validateFinalResult(candidate) {
            if (
              !isPlainObject(candidate)
              || requiredFields.some((field) => !Object.hasOwn(candidate, field))
            ) {
              throw new TypeError("result is missing required final-result fields");
            }
            for (const [field, allowed] of Object.entries(stateValues)) {
              if (!allowed.has(candidate[field])) {
                throw new TypeError(`${field} has an invalid value`);
              }
            }
            for (const field of stringFields) {
              if (typeof candidate[field] !== "string") {
                throw new TypeError(`${field} must be a string`);
              }
            }
            for (const field of ["configuration_fingerprint", "scope_hash"]) {
              if (candidate[field] !== "" && !fingerprintPattern.test(candidate[field])) {
                throw new TypeError(`${field} must be empty or lowercase 64-hex`);
              }
            }
            if (
              !fingerprintPattern.test(trustedScopeHash)
              || candidate.scope_hash !== trustedScopeHash
            ) {
              throw new TypeError("scope_hash must match the trusted review scope");
            }
            if (
              candidate.base_sha !== (trustedBaseSha || baseSha)
              || candidate.head_sha !== headSha
              || candidate.reviewed_head !== candidate.head_sha
            ) {
              throw new TypeError("result target must match the trusted review scope");
            }
            for (const field of booleanFields) {
              if (typeof candidate[field] !== "boolean") {
                throw new TypeError(`${field} must be a boolean`);
              }
            }
            for (const field of integerFields) {
              if (!Number.isSafeInteger(candidate[field]) || candidate[field] < 0) {
                throw new TypeError(`${field} must be a non-negative integer`);
              }
            }
            if (candidate.passes_completed > candidate.passes_requested) {
              throw new TypeError("passes_completed must not exceed passes_requested");
            }
            if (
              candidate.analysis_state === "complete"
              && (
                candidate.passes_requested === 0
                || candidate.passes_completed !== candidate.passes_requested
                || candidate.configuration_fingerprint === ""
                || candidate.scope_hash === ""
              )
            ) {
              throw new TypeError(
                "complete analysis requires all passes and nonempty review identity",
              );
            }
            const aggregateCounts = Object.fromEntries(
              severities.map((severity) => [severity, 0]),
            );
            for (const field of ["current_counts", "unresolved_counts"]) {
              const counts = candidate[field];
              if (
                !isPlainObject(counts)
                || Object.keys(counts).length !== severities.length
                || severities.some(
                  (severity) => (
                    !Object.hasOwn(counts, severity)
                    || !Number.isSafeInteger(counts[severity])
                    || counts[severity] < 0
                  ),
                )
              ) {
                throw new TypeError(`${field} must contain non-negative integer severity counts`);
              }
              for (const severity of severities) {
                aggregateCounts[severity] += counts[severity];
              }
            }
            const findingCount = severities.reduce(
              (total, severity) => total + aggregateCounts[severity],
              0,
            );
            const expectedMergeState = severities.some(
              (severity) => (
                blockingSeverities.has(severity)
                && aggregateCounts[severity] > 0
              ),
            ) ? "blocked" : "ready";
            if (candidate.merge_state !== expectedMergeState) {
              throw new TypeError(
                "merge_state must agree with configured blocking severity counts",
              );
            }
            const cycleIncomplete = candidate.review_cycle
              && candidate.review_cycle.state !== "ready";
            const expectedSampleState = findingCount > 0
              ? "findings"
              : cycleIncomplete
                ? "unknown"
                : candidate.analysis_state === "complete" && candidate.coverage === "bounded"
                  ? "clean"
                  : "unknown";
            if (candidate.sample_state !== expectedSampleState) {
              throw new TypeError("sample_state must agree with counts, analysis, and coverage");
            }
            if (
              !Array.isArray(candidate.remaining_analysis)
              || candidate.remaining_analysis.some(
                (reason) => (
                  typeof reason !== "string"
                  || !remainingAnalysisReasonSet.has(reason)
                ),
              )
              || new Set(candidate.remaining_analysis).size !== candidate.remaining_analysis.length
              || candidate.remaining_analysis.some(
                (reason, index) => (
                  index > 0
                  && remainingAnalysisReasons.indexOf(reason)
                    < remainingAnalysisReasons.indexOf(candidate.remaining_analysis[index - 1])
                ),
              )
            ) {
              throw new TypeError(
                "remaining_analysis must contain unique canonical ordered reason strings",
              );
            }
            if (
              !stateValues.analysis_state.has(trustedAnalysisState)
              || !stateValues.coverage.has(trustedCoverage)
              || trustedRemainingAnalysis === null
            ) {
              throw new TypeError("trusted review analysis metadata is unavailable");
            }
            if (
              (candidate.analysis_state === "complete" && trustedAnalysisState !== "complete")
              || (candidate.coverage === "bounded" && trustedCoverage !== "bounded")
              || trustedRemainingAnalysis.some(
                (reason) => !candidate.remaining_analysis.includes(reason),
              )
              || candidate.remaining_analysis.some(
                (reason) => (
                  !trustedRemainingAnalysis.includes(reason)
                  && !posterOwnedRemainingAnalysisReasons.has(reason)
                ),
              )
            ) {
              throw new TypeError("final result must not strengthen trusted review metadata");
            }
            if (
              candidate.analysis_state === "complete"
              && candidate.remaining_analysis.some(
                (reason) => reason !== "reconciliation_unknown",
              )
            ) {
              throw new TypeError(
                "complete analysis may only retain reconciliation_unknown",
              );
            }
            if (
              candidate.analysis_state === "inconclusive"
              && !candidate.remaining_analysis.some(
                (reason) => reason !== "reconciliation_unknown",
              )
            ) {
              throw new TypeError(
                "inconclusive analysis requires a base or execution failure reason",
              );
            }
            const expectedBoundedCoverage = (
              candidate.analysis_state === "complete"
              && (candidate.sample_state !== "unknown" || cycleIncomplete)
              && candidate.remaining_analysis.length === 0
            );
            if (
              (candidate.coverage === "bounded") !== expectedBoundedCoverage
              || (!expectedBoundedCoverage && candidate.remaining_analysis.length === 0)
            ) {
              throw new TypeError(
                "coverage and remaining_analysis must agree with analysis_state and sample_state",
              );
            }
            const expectedConvergence = (
              candidate.analysis_state === "complete"
              && candidate.sample_state === "clean"
              && !cycleIncomplete
            );
            if (
              candidate.bounded_converged !== expectedConvergence
              || candidate.converged !== expectedConvergence
            ) {
              throw new TypeError("convergence must agree with analysis_state and sample_state");
            }
            if (candidate.configuration_fingerprint !== trustedConfigurationFingerprint) {
              throw new TypeError(
                "configuration_fingerprint must match trusted review metadata",
              );
            }
            if (
              candidate.passes_requested !== trustedPassesRequested
              || candidate.passes_completed !== trustedPassesCompleted
            ) {
              throw new TypeError("pass counts must match trusted review metadata");
            }
          }

          let result = conservativeResult;
          let preserveResult = false;
          const existingResult = existsSync(resultFile) ? readFileSync(resultFile, "utf8") : "";
          if (existingResult.length > 0) {
            try {
              const candidate = JSON.parse(existingResult);
              validateFinalResult(candidate);
              result = candidate;
              preserveResult = true;
            } catch (error) {
              console.error(`::warning::review poster left an invalid result; replacing it conservatively: ${error.message}`);
            }
          }
          if (!preserveResult) {
            writeFileSync(resultFile, `${JSON.stringify(result, null, 2)}\n`);
          }

          const outputLines = [
            `analysis_state=${result.analysis_state}`,
            `merge_state=${result.merge_state}`,
            `sample_state=${result.sample_state}`,
            `bounded_converged=${result.bounded_converged}`,
            `base_sha=${result.base_sha}`,
            `head_sha=${result.head_sha}`,
            `configuration_fingerprint=${result.configuration_fingerprint}`,
            `passes_requested=${result.passes_requested}`,
            `passes_completed=${result.passes_completed}`,
            `current_counts=${JSON.stringify(result.current_counts)}`,
            `unresolved_counts=${JSON.stringify(result.unresolved_counts)}`,
            `reviewed_head=${result.reviewed_head}`,
            `scope_hash=${result.scope_hash}`,
            `coverage=${result.coverage}`,
            `remaining_analysis=${JSON.stringify(result.remaining_analysis)}`,
            `converged=${result.converged}`,
          ];
          if (result.review_cycle) {
            outputLines.push(
              `review_cycle_state=${result.review_cycle.state}`,
              `review_phase=${result.review_cycle.last_phase}`,
              `review_next_phase=${result.review_cycle.next_phase ?? "none"}`,
              `discovery_round=${result.review_cycle.discovery_round}`,
              `max_discovery_rounds=${result.review_cycle.max_discovery_rounds}`,
            );
          }
          if (process.env.GITHUB_OUTPUT) {
            const existingOutput = existsSync(process.env.GITHUB_OUTPUT)
              ? readFileSync(process.env.GITHUB_OUTPUT, "utf8")
              : "";
            const existingOutputLines = new Set(existingOutput.split("\n"));
            if (!outputLines.every((line) => existingOutputLines.has(line))) {
              appendFileSync(
                process.env.GITHUB_OUTPUT,
                `${existingOutput.length > 0 && !existingOutput.endsWith("\n") ? "\n" : ""}${outputLines.join("\n")}\n`,
              );
            }
          }

          const summaryLines = [
            "## Agentic review",
            "| Result | Value |",
            "| --- | --- |",
            `| Analysis | \`${result.analysis_state}\` |`,
            `| Merge gate | \`${result.merge_state}\` |`,
            `| Sample | \`${result.sample_state}\` |`,
            `| Bounded convergence | \`${result.bounded_converged ? "yes" : "no"}\` |`,
            `| Reviewed head | \`${result.reviewed_head}\` |`,
            `| Scope hash | \`${result.scope_hash}\` |`,
            `| Coverage | \`${result.coverage}\` |`,
            `| Remaining analysis | \`${JSON.stringify(result.remaining_analysis)}\` |`,
            ...(result.review_cycle
              ? [`| Review cycle | \`${result.review_cycle.state}\` · last \`${result.review_cycle.last_phase}\` · next \`${result.review_cycle.next_phase ?? "none"}\` · discovery ${result.review_cycle.discovery_round}/${result.review_cycle.max_discovery_rounds} |`]
              : []),
            `| Converged | \`${result.converged}\` |`,
            `| Base SHA | \`${result.base_sha}\` |`,
            `| Head SHA | \`${result.head_sha}\` |`,
            `| Configuration fingerprint | \`${result.configuration_fingerprint}\` |`,
            `| Passes | \`${result.passes_requested} requested / ${result.passes_completed} completed\` |`,
            `| Current findings | \`Critical: ${result.current_counts.Critical} · High: ${result.current_counts.High} · Medium: ${result.current_counts.Medium}\` |`,
            `| Held/unresolved findings | \`Critical: ${result.unresolved_counts.Critical} · High: ${result.unresolved_counts.High} · Medium: ${result.unresolved_counts.Medium}\` |`,
          ];
          if (process.env.GITHUB_STEP_SUMMARY) {
            const existingSummary = existsSync(process.env.GITHUB_STEP_SUMMARY)
              ? readFileSync(process.env.GITHUB_STEP_SUMMARY, "utf8")
              : "";
            const existingSummaryLines = new Set(existingSummary.split("\n"));
            if (!summaryLines.every((line) => existingSummaryLines.has(line))) {
              const separator = existingSummary.length === 0
                ? ""
                : existingSummary.endsWith("\n") ? "\n" : "\n\n";
              appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                `${separator}${summaryLines[0]}\n\n${summaryLines.slice(1).join("\n")}\n`,
              );
            }
          }
          NODE
          }
          export TRUSTED_METADATA=""
          export TRUSTED_FAILURE_RESULT=""

          poster_configured=true
          for name in REVIEW_MODE POST_COMMENT SUPPRESS_WRITES RESOLVE_STALE \
                      MAX_FINDINGS FAIL_ON_FINDINGS BLOCK_SEVERITIES; do
            if [ -z "${!name+x}" ]; then
              poster_configured=false
              break
            fi
          done
          if [ "${TARGET_ELIGIBLE:-}" != "true" ] \
            || [ -z "${GITHUB_REPO:-}" ] \
            || [ -z "${PR_NUMBER:-}" ] \
            || [ -z "${HEAD_SHA:-}" ] \
            || [ -z "${BASE_SHA:-}" ] \
            || [ "$poster_configured" != "true" ] \
            || [ -z "${TRUSTED_DATA_ROOT:-}" ] \
            || [ -z "${REVIEW_RESULT_HELPER:-}" ] \
            || [[ "${TRUSTED_DATA_ROOT:-}" != /* ]] \
            || [ "${REVIEW_POSTER:-}" != "${TRUSTED_DATA_ROOT:-}/scripts/post-review.mjs" ] \
            || [ "${REVIEW_RESULT_HELPER:-}" != "${TRUSTED_DATA_ROOT:-}/scripts/review-result.mjs" ] \
            || [ ! -f "${REVIEW_POSTER:-}" ] \
            || [ ! -f "${REVIEW_RESULT_HELPER:-}" ]; then
            echo "::warning::review setup is incomplete; emitting a conservative result"
            # Target resolution and the support checkout are both upstream of
            # this always() step, so the fallback cannot import either one.
            finalize_missing_surfaces
            exit 1
          fi

          # Snapshot the validated publication before presentation. The shared
          # result owner derives the crash fallback as well as the metadata used
          # to reject any invalid or strengthened result left by the poster.
          if [ -s "${REVIEW_PUBLICATION_FILE:-}" ]; then
            if TRUSTED_METADATA="$(
              node "$REVIEW_RESULT_HELPER" validate "$REVIEW_PUBLICATION_FILE"
            )" && TRUSTED_FAILURE_RESULT="$(
              HEAD_SHA="$HEAD_SHA" BLOCK_SEVERITIES="$BLOCK_SEVERITIES" \
                node "$REVIEW_RESULT_HELPER" failure "$REVIEW_PUBLICATION_FILE"
            )"; then
              export TRUSTED_METADATA
              export TRUSTED_FAILURE_RESULT
            else
              export TRUSTED_METADATA=""
              export TRUSTED_FAILURE_RESULT=""
              echo "::warning::trusted review publication is invalid or does not match the target head"
            fi
          fi

          poster_status=0
          REVIEW_MODE="$REVIEW_MODE" \
          POST_COMMENT="$POST_COMMENT" \
          SUPPRESS_WRITES="$SUPPRESS_WRITES" \
          RESOLVE_STALE="$RESOLVE_STALE" \
          MAX_FINDINGS="$MAX_FINDINGS" \
          FAIL_ON_FINDINGS="$FAIL_ON_FINDINGS" \
          BLOCK_SEVERITIES="$BLOCK_SEVERITIES" \
            node "$REVIEW_POSTER" || poster_status=$?
          if [ "$poster_status" -ne 0 ]; then
            if [ ! -s "${REVIEW_RESULT_FILE:-/tmp/review-result.json}" ]; then
              echo "::warning::review poster failed before emitting a final result; emitting a conservative result"
            fi
            finalize_missing_surfaces
            exit "$poster_status"
          fi

      - name: plan automatic final discovery
        id: continuation_cycle
        if: >-
          steps.poster.outputs.review_cycle_state == 'active'
          && steps.poster.outputs.review_next_phase == 'discovery'
        env:
          GH_TOKEN: ${{ steps.target.outputs.token || github.token }}
          GITHUB_REPO: ${{ steps.target.outputs.repo }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          HEAD_SHA: ${{ steps.target.outputs.head }}
          BASE_SHA: ${{ steps.target.outputs.base }}
          REVIEW_CYCLE_PLAN_FILE: /tmp/review-cycle-plan.json
          KNOWN_FINDINGS_FILE: /tmp/review-known-findings.json
          REVIEW_RESULT_FILE: /tmp/review-result.json
        run: |
          set -euo pipefail
          node "$REVIEW_POSTER" cycle-plan

      - name: run automatic final discovery
        if: >-
          steps.continuation_cycle.outputs.phase == 'discovery'
          && steps.continuation_cycle.outputs.should_run == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BASE: ${{ steps.target.outputs.base }}
          HEAD: ${{ steps.target.outputs.head }}
          AGENTIC_REVIEW_PHASE: ${{ steps.continuation_cycle.outputs.phase }}
          AGENTIC_REVIEW_KNOWN_FINDINGS: /tmp/review-known-findings.json
        run: *run-review-phase

      - name: post automatic final discovery
        id: continuation_poster
        if: ${{ !cancelled() && steps.continuation_cycle.outputs.phase == 'discovery' && steps.continuation_cycle.outputs.should_run == 'true' }}
        env:
          GH_TOKEN: ${{ steps.target.outputs.token || github.token }}
          TARGET_ELIGIBLE: ${{ steps.target.outputs.eligible }}
          REVIEW_PUBLICATION_FILE: /tmp/review-publication.json
          REVIEW_RESULT_FILE: /tmp/review-result.json
          GITHUB_REPO: ${{ steps.target.outputs.repo }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          HEAD_SHA: ${{ steps.target.outputs.head }}
          BASE_SHA: ${{ steps.target.outputs.base }}
          REVIEW_CYCLE_PLAN_FILE: /tmp/review-cycle-plan.json
          CYCLE_SHOULD_RUN: ${{ steps.continuation_cycle.outputs.should_run }}
          CYCLE_STATE: ${{ steps.continuation_cycle.outputs.cycle_state }}
          CYCLE_PHASE: ${{ steps.continuation_cycle.outputs.phase }}
          CYCLE_NEXT_PHASE: ${{ steps.continuation_cycle.outputs.next_phase }}
          CYCLE_JSON: ${{ steps.continuation_cycle.outputs.cycle_json }}
          CYCLE_DISCOVERY_ROUND: ${{ steps.continuation_cycle.outputs.discovery_round }}
        run: *post-review-phase

      - name: enforce incomplete verification gate
        if: >-
          !cancelled()
          && steps.cycle.outputs.phase == 'verification'
          && steps.poster.outcome == 'failure'
          && steps.continuation_poster.outcome == 'skipped'
        run: |
          echo "::error::verification did not reach the required final discovery"
          exit 1

      - name: upload review result
        if: ${{ !cancelled() && steps.target.outputs.eligible != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: agentic-review
          path: /tmp/review-result.json
          retention-days: 7
          if-no-files-found: error

      - name: upload partition shadow execution profile
        if: ${{ !cancelled() && inputs.partition_shadow && steps.target.outputs.eligible == 'true' && steps.cycle.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: agentic-review-partition-shadow-profile
          path: /tmp/review-partition-shadow-profile.json
          retention-days: 1
          if-no-files-found: ignore

      - name: upload optional review diagnostics
        if: ${{ !cancelled() && steps.target.outputs.eligible == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: agentic-review-diagnostics
          path: |
            /tmp/review.md
            /tmp/review-publication.json
            /tmp/review-runner.out
            /tmp/review-runner.err
            /tmp/review-pass-diagnostics.json
          retention-days: 7
          if-no-files-found: ignore

  # This diagnostic-only job deliberately has no outputs and cannot influence
  # the authoritative review job that precedes it.
  partition-shadow:
    needs: review
    if: ${{ always() && inputs.partition_shadow && (needs.review.result == 'success' || needs.review.result == 'failure') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: resolve partition shadow target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          IN_REPO: ${{ needs.review.outputs.shadow_repo }}
          IN_PR: ${{ needs.review.outputs.shadow_pr }}
          IN_BASE: ${{ needs.review.outputs.shadow_base }}
          IN_HEAD: ${{ needs.review.outputs.shadow_head }}
        run: |
          set -euo pipefail
          if [ -z "${IN_REPO:-}" ]; then
            {
              echo "repo=${GITHUB_REPOSITORY}"
              echo "pr=${{ github.event.pull_request.number }}"
              echo "base=${{ github.event.pull_request.base.sha }}"
              echo "head=${{ github.event.pull_request.head.sha }}"
              echo "eligible=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$IN_REPO" in
            */*[!A-Za-z0-9._/-]*|*/*/*|/*|*/) echo "::error::target_repo is not a plain owner/name: $IN_REPO"; exit 1 ;;
            */*) ;;
            *) echo "::error::target_repo is not owner/name: $IN_REPO"; exit 1 ;;
          esac
          case "$IN_PR" in ''|*[!0-9]*) echo "::error::target_pr is not a number: $IN_PR"; exit 1 ;; esac
          if [ -n "${IN_BASE:-}" ] && [ -n "${IN_HEAD:-}" ] && [ "$IN_REPO" = "$GITHUB_REPOSITORY" ]; then
            {
              echo "repo=$IN_REPO"
              echo "pr=$IN_PR"
              echo "base=$IN_BASE"
              echo "head=$IN_HEAD"
              echo "eligible=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$IN_REPO" = "$GITHUB_REPOSITORY" ]; then
            gh_t() {
              case "$1" in
                .base.sha) printf '%s\n' "$IN_BASE" ;;
                .head.sha) printf '%s\n' "$IN_HEAD" ;;
                *) gh api "repos/${IN_REPO}/pulls/${IN_PR}" --jq "$1" ;;
              esac
            }
            if [ "$(gh_t .draft)" = "true" ] \
              || [ "$(gh_t '.head.repo.full_name == .base.repo.full_name')" != "true" ]; then
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            {
              echo "repo=$IN_REPO"
              echo "pr=$IN_PR"
              echo "base=$(gh_t .base.sha)"
              echo "head=$(gh_t .head.sha)"
              echo "eligible=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [ -n "${APP_ID:-}" ] && [ -n "${APP_PRIVATE_KEY:-}" ] \
            || { echo "::error::target_repo dispatch needs App credentials"; exit 1; }
          cat > "${RUNNER_TEMP}/partition-shadow-app-token.mjs" <<'NODE'
          import { createSign } from "node:crypto";
          const [repo] = process.argv.slice(2);
          const b64 = (value) => Buffer.from(JSON.stringify(value)).toString("base64url");
          const now = Math.floor(Date.now() / 1000);
          const body = `${b64({ alg: "RS256", typ: "JWT" })}.${b64({ iat: now - 60, exp: now + 540, iss: process.env.APP_ID })}`;
          const signature = createSign("RSA-SHA256").update(body).end()
            .sign(process.env.APP_PRIVATE_KEY, "base64url");
          const jwt = `${body}.${signature}`;
          const api = async (url, options = {}) => {
            const response = await fetch(url, {
              ...options,
              headers: { authorization: `Bearer ${jwt}`, accept: "application/vnd.github+json", ...options.headers },
            });
            if (!response.ok) throw new Error(`${options.method ?? "GET"} ${url} -> ${response.status}`);
            return response.json();
          };
          const installation = await api(`https://api.github.com/repos/${repo}/installation`);
          const token = await api(installation.access_tokens_url, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              repositories: [repo.split("/")[1]],
              permissions: { contents: "read", pull_requests: "read" },
            }),
          });
          process.stdout.write(token.token);
          NODE
          token="$(node "${RUNNER_TEMP}/partition-shadow-app-token.mjs" "$IN_REPO")"
          echo "::add-mask::$token"
          cleanup_token() {
            rm -f -- "${RUNNER_TEMP}/partition-shadow-app-token.mjs"
            unset token auth
          }
          trap cleanup_token EXIT
          gh_t() {
            case "$1" in
              .base.sha) printf '%s\n' "$IN_BASE" ;;
              .head.sha) printf '%s\n' "$IN_HEAD" ;;
              *) GH_TOKEN="$token" gh api "repos/${IN_REPO}/pulls/${IN_PR}" --jq "$1" ;;
            esac
          }
          [ "$(gh_t .state)" = "open" ] || { echo "::error::${IN_REPO}#${IN_PR} is not open"; exit 1; }
          if [ "$(gh_t .draft)" = "true" ] \
            || [ "$(gh_t '.head.repo.full_name == .base.repo.full_name')" != "true" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(gh_t .base.sha)"
          head="$(gh_t .head.sha)"
          auth="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"
          git -C "$GITHUB_WORKSPACE" init --quiet
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${IN_REPO}.git"
          git -C "$GITHUB_WORKSPACE" \
            -c credential.helper= \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags --depth=1 origin "$base" "$head"
          auth=""
          git -C "$GITHUB_WORKSPACE" checkout --detach --force "$head"
          cleanup_token
          trap - EXIT
          {
            echo "repo=$IN_REPO"
            echo "pr=$IN_PR"
            echo "base=$base"
            echo "head=$head"
            echo "checked_out=true"
            echo "eligible=true"
          } >> "$GITHUB_OUTPUT"

      - name: checkout immutable partition shadow target
        if: steps.target.outputs.eligible == 'true' && steps.target.outputs.checked_out != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.target.outputs.repo }}
          ref: ${{ steps.target.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: resolve partition shadow support ref
        id: central-ref
        if: steps.target.outputs.eligible == 'true'
        env:
          IN_CENTRAL_REF: ${{ inputs.central_ref }}
        run: |
          set -euo pipefail
          CENTRAL_REF="${IN_CENTRAL_REF:-main}"
          if [ "$CENTRAL_REF" = "main" ]; then
            RESOLVED_REF="refs/heads/main"
          elif [[ "$CENTRAL_REF" =~ ^[0-9a-f]{40}$ ]]; then
            RESOLVED_REF="$CENTRAL_REF"
          elif [[ "$CENTRAL_REF" =~ ^v(0|[1-9][0-9]*)$ ]] \
            || [[ "$CENTRAL_REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            RESOLVED_REF="refs/tags/$CENTRAL_REF"
          else
            echo "::error::central_ref is invalid"
            exit 1
          fi
          echo "ref=$RESOLVED_REF" >> "$GITHUB_OUTPUT"

      - name: prepare partition shadow support checkout
        if: steps.target.outputs.eligible == 'true'
        run: rm -rf -- .partition-shadow-support

      - name: fetch trusted partition shadow helpers
        if: steps.target.outputs.eligible == 'true'
        uses: actions/checkout@v4
        with:
          repository: atomikpanda/agentic-review
          ref: ${{ steps.central-ref.outputs.ref }}
          token: ${{ github.token }}
          persist-credentials: false
          path: .partition-shadow-support
          sparse-checkout: scripts

      - name: strip target agent configuration
        if: steps.target.outputs.eligible == 'true'
        run: |
          bash "$GITHUB_WORKSPACE/.partition-shadow-support/scripts/strip-agent-config.sh" --strip "$GITHUB_WORKSPACE"

      - name: download partition shadow execution profile
        if: steps.target.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: agentic-review-partition-shadow-profile
          path: ${{ runner.temp }}/partition-shadow-profile

      - name: capture partition shadow diagnostics
        if: steps.target.outputs.eligible == 'true'
        env:
          BASE_SHA: ${{ steps.target.outputs.base }}
          HEAD_SHA: ${{ steps.target.outputs.head }}
          SUPPORT_ROOT: ${{ github.workspace }}/.partition-shadow-support
          PARTITION_SHADOW_OUTPUT: /tmp/review-partition-shadow.json
        run: |
          set -euo pipefail
          LIMITS_FILE="${RUNNER_TEMP}/partition-shadow-limits.json"
          CONFIG_FILE="${RUNNER_TEMP}/partition-shadow-config.json"
          PROFILE_FILE="${RUNNER_TEMP}/partition-shadow-profile/review-partition-shadow-profile.json"
          CAPTURE_FILE="${RUNNER_TEMP}/partition-shadow-capture.json"
          CAPTURE_HELPER="${SUPPORT_ROOT}/scripts/review-capture.mjs"
          UNITS_HELPER="${SUPPORT_ROOT}/scripts/review-units.mjs"
          rm -f -- "$CAPTURE_FILE" "$PARTITION_SHADOW_OUTPUT"
          printf '%s\n' '{"schema_version":1,"max_patch_bytes":8388608,"max_raw_z_bytes":8388608,"max_single_blob_bytes":16777216,"max_total_blob_bytes":67108864,"max_capture_seconds":30}' > "$LIMITS_FILE"
          printf '%s\n' '{"schema_version":1,"benchmark_revision":"","atom_target_bytes":16000,"unit_target_bytes":64000,"max_frontier_units":128,"max_shadow_artifact_bytes":4194304}' > "$CONFIG_FILE"
          fallback() {
            local status="$1" reason="$2"
            STATUS="$status" REASON="$reason" BASE_SHA="$BASE_SHA" HEAD_SHA="$HEAD_SHA" \
              node --input-type=module - "$UNITS_HELPER" "$CONFIG_FILE" "$CAPTURE_FILE" "$PARTITION_SHADOW_OUTPUT" <<'NODE'
          import { existsSync, readFileSync } from "node:fs";
          import { pathToFileURL } from "node:url";
          const [helper, configFile, captureFile, output] = process.argv.slice(2);
          const { buildShadowDiagnostic, writeShadowOutput } = await import(pathToFileURL(helper).href);
          const config = JSON.parse(readFileSync(configFile, "utf8"));
          let capture;
          try { capture = JSON.parse(readFileSync(captureFile, "utf8")); } catch {}
          const observed_lower_bounds = capture?.observed_lower_bounds
            ?? { patch_bytes: 0, raw_z_bytes: 0, blob_bytes: 0, blob_count: 0, elapsed_milliseconds: 0 };
          writeShadowOutput(output, buildShadowDiagnostic({
            status: process.env.STATUS,
            base_sha: process.env.BASE_SHA,
            head_sha: process.env.HEAD_SHA,
            benchmark_revision: config.benchmark_revision,
            capture_hash: capture?.capture_hash,
            reason_codes: [process.env.REASON],
            diagnostic: "Partition shadow helper failed; details redacted.",
            observed_lower_bounds,
            counts: {},
          }, config.max_shadow_artifact_bytes));
          NODE
          }
          if ! node "$CAPTURE_HELPER" capture --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA" --limits "$LIMITS_FILE" --out "$CAPTURE_FILE"; then
            fallback capture_failed capture_helper_failed
          elif ! node "$UNITS_HELPER" shadow --capture "$CAPTURE_FILE" --profile "$PROFILE_FILE" --config "$CONFIG_FILE" --diagnostics-out "$PARTITION_SHADOW_OUTPUT"; then
            fallback planner_failed planner_helper_failed
          fi
          test -s "$PARTITION_SHADOW_OUTPUT" || fallback capture_failed output_unavailable

      - name: upload optional partition shadow diagnostics
        if: ${{ !cancelled() && steps.target.outputs.eligible == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: agentic-review-partition-shadow
          path: /tmp/review-partition-shadow.json
          retention-days: 7
          if-no-files-found: ignore
